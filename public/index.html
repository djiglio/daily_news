<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily News - Rassegna Stampa</title>
    <meta name="description" content="Rassegna stampa quotidiana personalizzata, zero-cost, senza ads.">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/jpeg" href="/icon.jpg">
    <link rel="apple-touch-icon" href="/icon.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta id="theme-color-meta" name="theme-color" content="#fafaf9">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Lora"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .drawer-open { overflow: hidden; }
    
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
    <!-- Alpine.js for interactions -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/intersect@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-messaging-compat.js"></script>
</head>
<body class="bg-stone-100 text-stone-900 dark:bg-neutral-900 dark:text-stone-100 font-sans transition-colors duration-300" 
      x-data="newsApp()" 
      x-init="initApp()"
      :class="{'drawer-open': activeArticle !== null}">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-stone-50/80 dark:bg-neutral-800/80 backdrop-blur-md border-b border-stone-200 dark:border-neutral-700 shadow-sm pt-[env(safe-area-inset-top)]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <h1 class="text-3xl font-serif tracking-widest text-stone-900 dark:text-white" style="-webkit-text-stroke: 1.5px; -webkit-text-fill-color: transparent;">DN</h1>
            <div class="flex items-center">
                <button @click="settingsOpen = true" class="p-2 rounded-full hover:bg-stone-100 dark:hover:bg-neutral-700 transition text-stone-600 dark:text-stone-300" title="Impostazioni">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 min-h-screen flex flex-col lg:flex-row gap-8">
        
        <!-- Sidebar Navigation (Desktop) -->
        <aside class="hidden lg:block w-48 flex-shrink-0">
            <div class="sticky top-24">
                <h3 class="text-xs font-bold text-stone-900 dark:text-stone-400 uppercase tracking-wider mb-4">Sezioni</h3>
                <nav class="flex flex-col space-y-2" x-show="!loading && !error">
                    <template x-for="(articles, category) in data.categories" :key="category">
                        <a :href="'#' + category.replace(/\s+/g, '-').toLowerCase()" 
                           class="text-sm font-medium transition"
                           :class="activeSection === category.replace(/\s+/g, '-').toLowerCase() ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-stone-600 dark:text-stone-400 hover:text-indigo-600 dark:hover:text-indigo-400'"
                           x-text="category"></a>
                    </template>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-grow min-w-0">
        
        <!-- Loading State -->
        <div x-show="loading" class="flex justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
        </div>

        <!-- Error State -->
        <div x-show="error" x-cloak class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
            <span class="block sm:inline" x-text="error"></span>
        </div>

        <!-- Mobile Navigation -->
        <div class="lg:hidden sticky top-16 z-30 bg-stone-100/90 dark:bg-neutral-900/90 backdrop-blur-md border-b border-stone-200 dark:border-neutral-700 -mx-4 px-4 sm:-mx-6 sm:px-6 py-3 mb-6 overflow-x-auto whitespace-nowrap hide-scrollbar">
            <nav class="flex space-x-6" x-show="!loading && !error">
                <template x-for="(articles, category) in data.categories" :key="category">
                    <a :href="'#' + category.replace(/\s+/g, '-').toLowerCase()" 
                       class="inline-block text-sm font-medium px-2 py-1 transition-colors border-b-2"
                       :class="activeSection === category.replace(/\s+/g, '-').toLowerCase() ? 'text-indigo-600 dark:text-indigo-400 font-bold border-indigo-600 dark:border-indigo-400' : 'text-stone-600 dark:text-stone-400 border-transparent'"
                       x-text="category"></a>
                </template>
            </nav>
        </div>
        
        <!-- Categories and News -->
        <div x-show="!loading && !error" x-cloak class="space-y-12">
            <template x-for="(articles, category) in data.categories" :key="category">
                <section :id="category.replace(/\s+/g, '-').toLowerCase()" class="scroll-mt-32">
                    <div class="flex items-center mb-6">
                        <h2 class="text-2xl font-bold text-stone-800 dark:text-stone-100" x-text="category"></h2>
                        <div class="ml-4 flex-grow h-px bg-stone-200 dark:bg-neutral-700"></div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <template x-for="(article, index) in articles" :key="article.title">
                            <article :class="index === 0 ? 'md:col-span-2 lg:col-span-2' : ''" class="bg-stone-50 dark:bg-neutral-800 rounded-xl shadow-sm hover:shadow-md transition-shadow border border-stone-100 dark:border-neutral-700 cursor-pointer overflow-hidden flex flex-col h-full"
                                     @click="openArticle(article, category)">
                                <template x-if="article.image_url">
                                    <div class="w-full h-48 overflow-hidden bg-stone-200 dark:bg-neutral-700">
                                        <img :src="article.image_url" alt="" class="w-full h-full object-cover" loading="lazy">
                                    </div>
                                </template>
                                <div class="p-6 flex-grow flex flex-col">
                                    <span class="inline-block px-2 py-1 text-xs font-semibold tracking-wide text-indigo-700 bg-indigo-50 dark:bg-indigo-900/30 dark:text-indigo-300 rounded-md mb-3 w-fit" x-text="category"></span>
                                    <h3 :class="index === 0 ? 'text-2xl md:text-3xl' : 'text-lg'" class="font-bold mb-3 leading-snug font-serif text-stone-900 dark:text-white" x-text="article.title"></h3>
                                    <p :class="index === 0 ? 'line-clamp-5 text-base' : 'line-clamp-3 text-sm'" class="text-stone-600 dark:text-stone-300 flex-grow" x-text="article.summary"></p>
                                </div>
                                <div class="px-6 py-4 border-t border-stone-100 dark:border-neutral-700 bg-stone-50/50 dark:bg-neutral-800/50 mt-auto">
                                    <span class="text-xs font-medium text-indigo-600 dark:text-indigo-400 flex items-center">
                                        Leggi l'approfondimento &rarr;
                                    </span>
                                </div>
                            </article>
                        </template>
                    </div>
                </section>
            </template>
        </div>
    </div>
    </main>

    <!-- Drawer / Modal for Deep Dive -->
    <div x-show="activeArticle !== null" x-cloak class="fixed inset-0 z-50 overflow-hidden" aria-labelledby="slide-over-title" role="dialog" aria-modal="true">
        <div class="absolute inset-0 overflow-hidden">
            <!-- Backdrop -->
            <div x-show="activeArticle !== null" 
                 x-transition:enter="ease-in-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
                 x-transition:leave="ease-in-out duration-300" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
                 class="absolute inset-0 bg-stone-900 dark:bg-neutral-900 bg-opacity-75 backdrop-blur-sm transition-opacity" 
                 @click="closeArticle()"></div>

            <div class="fixed inset-y-0 right-0 max-w-full flex">
                <!-- Sliding panel -->
                <div x-show="activeArticle !== null"
                     x-data="{ scrollProgress: 0 }"
                     @scroll="scrollProgress = ($event.target.scrollTop / Math.max(1, $event.target.scrollHeight - $event.target.clientHeight)) * 100"
                     x-transition:enter="transform transition ease-in-out duration-300 sm:duration-400" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
                     x-transition:leave="transform transition ease-in-out duration-300 sm:duration-400" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
                     class="w-screen max-w-2xl h-full flex flex-col bg-stone-50 dark:bg-neutral-900 shadow-xl overflow-y-auto relative">
                    
                    <div class="sticky top-0 z-10 flex flex-col bg-stone-50/90 dark:bg-neutral-900/90 backdrop-blur">
                        <div class="flex items-center justify-between px-6 py-4 border-b border-stone-200 dark:border-neutral-700">
                            <span class="inline-block px-3 py-1 text-xs font-semibold tracking-wide text-indigo-700 bg-indigo-50 dark:bg-indigo-900/30 dark:text-indigo-300 rounded-md" x-text="activeCategory"></span>
                            <button type="button" @click="closeArticle()" class="rounded-md text-stone-400 hover:text-stone-500 dark:hover:text-stone-300 focus:outline-none">
                                <span class="sr-only">Chiudi</span>
                                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                        <div class="h-1 w-full bg-stone-100 dark:bg-neutral-800">
                            <div class="h-1 bg-indigo-600 dark:bg-indigo-400 transition-all duration-150 ease-out" :style="`width: ${scrollProgress}%`"></div>
                        </div>
                    </div>

                    <div class="p-6 sm:p-8" x-if="activeArticle">
                        <h2 class="text-3xl font-bold font-serif mb-6 leading-tight text-stone-900 dark:text-white" x-text="activeArticle?.title"></h2>
                        <template x-if="activeArticle?.image_url">
                            <div class="w-full h-64 sm:h-80 mb-8 rounded-xl overflow-hidden shadow-sm bg-stone-200 dark:bg-neutral-700">
                                <img :src="activeArticle?.image_url" alt="" class="w-full h-full object-cover" loading="lazy">
                            </div>
                        </template>
                        <div class="mb-8 p-4 bg-indigo-50 dark:bg-indigo-900/20 border-l-4 border-indigo-500 rounded-r-lg">
                            <p class="text-sm font-medium text-stone-800 dark:text-stone-200 italic" x-text="activeArticle?.summary"></p>
                        </div>
                        
                        <div class="prose dark:prose-invert prose-indigo max-w-none font-serif text-stone-700 dark:text-stone-300 leading-relaxed mb-10 whitespace-pre-wrap" x-text="activeArticle?.deep_dive"></div>
                        
                        <div class="mt-8 pt-8 border-t border-stone-200 dark:border-neutral-700">
                            <h4 class="text-sm font-bold text-stone-900 dark:text-white uppercase tracking-wider mb-4">Fonti & Approfondimenti</h4>
                            <ul class="space-y-3">
                                <template x-for="source in activeArticle?.sources" :key="source">
                                    <li>
                                        <a :href="source" target="_blank" rel="noopener noreferrer" class="text-sm text-indigo-600 dark:text-indigo-400 hover:underline flex items-start gap-2 break-all">
                                            <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                            <span x-text="source"></span>
                                        </a>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>

    <!-- Settings Modal -->
    <div x-show="settingsOpen" style="display: none;" class="relative z-50" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div x-show="settingsOpen" x-transition.opacity class="fixed inset-0 bg-stone-900/80 backdrop-blur-sm transition-opacity"></div>
        <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
                <div x-show="settingsOpen" @click.away="settingsOpen = false" x-transition class="relative transform overflow-hidden rounded-2xl bg-stone-50 dark:bg-neutral-800 text-left shadow-xl transition-all sm:my-8 w-full max-w-lg border border-stone-200 dark:border-neutral-700">
                    <div class="px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-2xl font-bold font-serif text-stone-900 dark:text-stone-100" id="modal-title">Impostazioni</h3>
                            <button @click="settingsOpen = false" class="text-stone-400 hover:text-stone-500">
                                <span class="sr-only">Chiudi</span>
                                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                            </button>
                        </div>

                        <div class="space-y-6">
                            <!-- Last Update -->
                            <div class="flex justify-between items-center py-3 border-b border-stone-200 dark:border-neutral-700">
                                <span class="font-medium text-stone-700 dark:text-stone-300">Ultimo aggiornamento</span>
                                <span class="text-stone-500 dark:text-stone-400 text-sm font-medium" x-text="lastUpdate"></span>
                            </div>

                            <!-- Theme -->
                            <div class="flex justify-between items-center py-3 border-b border-stone-200 dark:border-neutral-700">
                                <span class="font-medium text-stone-700 dark:text-stone-300">Tema Scuro</span>
                                <button @click="toggleTheme()" :class="isDark ? 'bg-indigo-600' : 'bg-stone-300 dark:bg-neutral-600'" class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out">
                                    <span aria-hidden="true" :class="isDark ? 'translate-x-5' : 'translate-x-0'" class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
                                </button>
                            </div>

                            <!-- Font Size -->
                            <div class="py-3 border-b border-stone-200 dark:border-neutral-700">
                                <div class="flex justify-between items-center mb-4">
                                    <span class="font-medium text-stone-700 dark:text-stone-300">Dimensione Testo</span>
                                </div>
                                <div class="flex gap-3">
                                    <button @click="changeFontSize(14)" :class="fontSize === 14 ? 'bg-indigo-600 text-white' : 'bg-stone-200 text-stone-700 dark:bg-neutral-700 dark:text-stone-300'" class="flex-1 py-2 rounded-lg font-medium transition">Piccolo</button>
                                    <button @click="changeFontSize(16)" :class="fontSize === 16 ? 'bg-indigo-600 text-white' : 'bg-stone-200 text-stone-700 dark:bg-neutral-700 dark:text-stone-300'" class="flex-1 py-2 rounded-lg font-medium transition">Medio</button>
                                    <button @click="changeFontSize(18)" :class="fontSize === 18 ? 'bg-indigo-600 text-white' : 'bg-stone-200 text-stone-700 dark:bg-neutral-700 dark:text-stone-300'" class="flex-1 py-2 rounded-lg font-medium transition">Grande</button>
                                </div>
                            </div>

                            <!-- Notifications -->
                            <div class="py-3">
                                <div class="flex justify-between items-center">
                                    <span class="font-medium text-stone-700 dark:text-stone-300">Notifiche Push</span>
                                    <button @click="enablePushNotifications()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition shadow-sm">
                                        Genera Token
                                    </button>
                                </div>
                                <p class="text-xs text-stone-500 dark:text-stone-400 mt-2 leading-relaxed">Ricevi un avviso quando la nuova rassegna è pronta. Incolla il Token generato in GitHub.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

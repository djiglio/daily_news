<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily News - Rassegna Stampa</title>
    <meta name="description" content="Rassegna stampa quotidiana personalizzata, zero-cost, senza ads.">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/jpeg" href="/icon.jpg">
    <link rel="apple-touch-icon" href="/icon.jpg">
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        .drawer-open { overflow: hidden; }
    </style>
    <!-- Alpine.js for interactions -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-stone-100 text-stone-900 dark:bg-neutral-900 dark:text-stone-100 font-sans transition-colors duration-300" 
      x-data="newsApp()" 
      x-init="initApp()"
      :class="{'drawer-open': activeArticle !== null}">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-stone-50/80 dark:bg-neutral-800/80 backdrop-blur-md border-b border-stone-200 dark:border-neutral-700 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <h1 class="text-2xl font-bold tracking-tight text-indigo-600 dark:text-indigo-400">Daily News</h1>
            <div class="flex items-center gap-4">
                <span class="text-xs text-stone-500 dark:text-stone-400" x-text="'Aggiornato: ' + lastUpdate"></span>
                <button @click="toggleTheme()" class="p-2 rounded-full hover:bg-stone-100 dark:hover:bg-neutral-700 transition">
                    <svg x-show="!isDark" class="w-5 h-5 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg x-show="isDark" x-cloak class="w-5 h-5 text-stone-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 min-h-screen">
        
        <!-- Loading State -->
        <div x-show="loading" class="flex justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
        </div>

        <!-- Error State -->
        <div x-show="error" x-cloak class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
            <span class="block sm:inline" x-text="error"></span>
        </div>

        <!-- Categories and News -->
        <div x-show="!loading && !error" x-cloak class="space-y-12">
            <template x-for="(articles, category) in data.categories" :key="category">
                <section>
                    <div class="flex items-center mb-6">
                        <h2 class="text-2xl font-bold text-stone-800 dark:text-stone-100" x-text="category"></h2>
                        <div class="ml-4 flex-grow h-px bg-stone-200 dark:bg-neutral-700"></div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <template x-for="article in articles" :key="article.title">
                            <article class="bg-stone-50 dark:bg-neutral-800 rounded-xl shadow-sm hover:shadow-md transition-shadow border border-stone-100 dark:border-neutral-700 cursor-pointer overflow-hidden flex flex-col h-full"
                                     @click="openArticle(article, category)">
                                <div class="p-6 flex-grow flex flex-col">
                                    <span class="inline-block px-2 py-1 text-xs font-semibold tracking-wide text-indigo-700 bg-indigo-50 dark:bg-indigo-900/30 dark:text-indigo-300 rounded-md mb-3 w-fit" x-text="category"></span>
                                    <h3 class="text-lg font-bold mb-3 leading-snug font-serif text-stone-900 dark:text-white" x-text="article.title"></h3>
                                    <p class="text-stone-600 dark:text-stone-300 text-sm flex-grow line-clamp-3" x-text="article.summary"></p>
                                </div>
                                <div class="px-6 py-4 border-t border-stone-100 dark:border-neutral-700 bg-stone-50/50 dark:bg-neutral-800/50 mt-auto">
                                    <span class="text-xs font-medium text-indigo-600 dark:text-indigo-400 flex items-center">
                                        Leggi l'approfondimento &rarr;
                                    </span>
                                </div>
                            </article>
                        </template>
                    </div>
                </section>
            </template>
        </div>
    </main>

    <!-- Drawer / Modal for Deep Dive -->
    <div x-show="activeArticle !== null" x-cloak class="fixed inset-0 z-50 overflow-hidden" aria-labelledby="slide-over-title" role="dialog" aria-modal="true">
        <div class="absolute inset-0 overflow-hidden">
            <!-- Backdrop -->
            <div x-show="activeArticle !== null" 
                 x-transition:enter="ease-in-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
                 x-transition:leave="ease-in-out duration-300" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
                 class="absolute inset-0 bg-stone-900 dark:bg-neutral-900 bg-opacity-75 backdrop-blur-sm transition-opacity" 
                 @click="closeArticle()"></div>

            <div class="fixed inset-y-0 right-0 max-w-full flex">
                <!-- Sliding panel -->
                <div x-show="activeArticle !== null"
                     x-transition:enter="transform transition ease-in-out duration-300 sm:duration-400" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
                     x-transition:leave="transform transition ease-in-out duration-300 sm:duration-400" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
                     class="w-screen max-w-2xl h-full flex flex-col bg-stone-50 dark:bg-neutral-900 shadow-xl overflow-y-auto">
                    
                    <div class="sticky top-0 z-10 flex items-center justify-between px-6 py-4 border-b border-stone-200 dark:border-neutral-700 bg-stone-50/90 dark:bg-neutral-900/90 backdrop-blur">
                        <span class="inline-block px-3 py-1 text-xs font-semibold tracking-wide text-indigo-700 bg-indigo-50 dark:bg-indigo-900/30 dark:text-indigo-300 rounded-md" x-text="activeCategory"></span>
                        <button type="button" @click="closeArticle()" class="rounded-md text-stone-400 hover:text-stone-500 dark:hover:text-stone-300 focus:outline-none">
                            <span class="sr-only">Chiudi</span>
                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>

                    <div class="p-6 sm:p-8" x-if="activeArticle">
                        <h2 class="text-3xl font-bold font-serif mb-6 leading-tight text-stone-900 dark:text-white" x-text="activeArticle?.title"></h2>
                        <div class="mb-8 p-4 bg-indigo-50 dark:bg-indigo-900/20 border-l-4 border-indigo-500 rounded-r-lg">
                            <p class="text-sm font-medium text-stone-800 dark:text-stone-200 italic" x-text="activeArticle?.summary"></p>
                        </div>
                        
                        <div class="prose dark:prose-invert prose-indigo max-w-none font-serif text-stone-700 dark:text-stone-300 leading-relaxed mb-10 whitespace-pre-wrap" x-text="activeArticle?.deep_dive"></div>
                        
                        <div class="mt-8 pt-8 border-t border-stone-200 dark:border-neutral-700">
                            <h4 class="text-sm font-bold text-stone-900 dark:text-white uppercase tracking-wider mb-4">Fonti & Approfondimenti</h4>
                            <ul class="space-y-3">
                                <template x-for="source in activeArticle?.sources" :key="source">
                                    <li>
                                        <a :href="source" target="_blank" rel="noopener noreferrer" class="text-sm text-indigo-600 dark:text-indigo-400 hover:underline flex items-start gap-2 break-all">
                                            <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                                            <span x-text="source"></span>
                                        </a>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>

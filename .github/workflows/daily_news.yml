name: Daily News Generator

on:
  workflow_dispatch: # Avvio manuale
  repository_dispatch: # Avvio universale via Webhook/API
    types: [daily_news_trigger]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      FCM_TOKEN: ${{ secrets.FCM_TOKEN }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u generate_news.py 2>&1 | tee generator.log

      - name: Diagnostic Output on Failure
        if: failure()
        run: |
          echo "### ❌ Output Completo dell'Errore" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 generator.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Capture Error Log on Failure
        if: failure()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p logs
          cp generator.log logs/error.log
          git add logs/error.log
          git commit -m "ci: log failure details [skip ci]" || true
          git push || true

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/news_today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Aggiornamento automatico rassegna stampa $(date +'%Y-%m-%d')" && git push)

      - name: Send Push Notification (FCM)
        run: python -u send_fcm.py

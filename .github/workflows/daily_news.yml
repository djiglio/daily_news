name: Daily News Generator

on:
  schedule:
    - cron: '13 6,18 * * *' # 06:13 e 18:13 UTC (circa 08:13 e 20:13 in Italia)
  workflow_dispatch: # Permette l'esecuzione manuale

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_news.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/news_today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Aggiornamento automatico rassegna stampa $(date +'%Y-%m-%d')" && git push)

      - name: Send Push Notification (FCM)
        env:
          FCM_TOKEN: ${{ secrets.FCM_TOKEN }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        if: env.FCM_TOKEN != '' && env.FCM_SERVICE_ACCOUNT != ''
        run: |
          pip install google-auth
          python send_fcm.py
